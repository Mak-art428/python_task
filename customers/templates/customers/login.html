
<!DOCTYPE html>
<html>
<head>
    <title>Login - Advance Billing System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #d63384;
        }

        .options {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .options button {
            flex: 1;
            padding: 10px;
            border: 1px solid #e8a0bf;
            background: white;
            color: #d63384;
            border-radius: 6px;
            cursor: pointer;
        }

        .options button.active {
            background: #d63384;
            color: white;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

       #toast {
    visibility: hidden;
    min-width: 250px;
    padding: 15px;
    position: fixed;
    top: 20px;
    right: 20px;
    border-radius: 8px;
    color: white;
    text-align: center;
    z-index: 1000;
}

#toast.success {
    background: #28a745;
}

#toast.error {
    background: #dc3545;
}

#toast.show {
    visibility: visible;
}
        
    </style>
</head>

<body>
<div id="toast"></div>
<div class="login-box">

    <h2>Advance Billing System</h2>
    <h3>Login</h3>

    <div class="options">
        <button type="button" id="adminBtn" class="active"
            onclick="selectRole('admin')">Admin</button>

        <button type="button" id="distributorBtn"
            onclick="selectRole('distributor')">Distributor</button>
    </div>

    <form id="loginForm">

        <input type="email" id="email"
            placeholder="Enter Email" required>

        <input type="password" id="password"
            placeholder="Enter Password" required>

        <button type="submit" class="login-btn">Login</button>

    </form>

    <p id="message"></p>

</div>

<script>
    let selectedRole = 'admin';

    function selectRole(role) {
        selectedRole = role;

        document.getElementById('adminBtn').classList.toggle(
            'active', role === 'admin'
        );

        document.getElementById('distributorBtn').classList.toggle(
            'active', role === 'distributor'
        );
    }
    function showToast(message, type) {
        
    const toast = document.getElementById('toast');

    toast.innerText = message;
    toast.className = 'show ' + type;

    setTimeout(function() {
        toast.className = '';
    }, 3000);
}
    
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const url = selectedRole === 'admin'
            ? '/api/admin/login/'
            : '/api/distributor/login/';

        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({
                email: email,
                password: password
            }),
            credentials: 'same-origin'
        });

        const data = await response.json();

    if (data.success) {
    showToast(data.message, 'success');

    setTimeout(function() {
        window.location.href = '/dashboard/';
    }, 1000);

} else {
    showToast(data.message, 'error');
}
});
</script>

</body>
</html>
