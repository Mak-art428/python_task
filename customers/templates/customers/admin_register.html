
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration - ABS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #fce4ec;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-card {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(190, 80, 120, 0.15);
        }

        .logo {
            width: 65px;
            height: 65px;
            background: #f8bbd0;
            color: #ad416b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            font-weight: bold;
            border-radius: 15px;
            margin: auto;
        }

        .heading {
            color: #b84d75;
            font-weight: bold;
        }

        .form-label {
            color: #754457;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            background: #fff7fa;
            border: 1px solid #f3c5d5;
            border-radius: 8px;
            padding: 11px;
        }

        .form-control:focus {
            border-color: #d96b93;
            box-shadow: 0 0 0 0.2rem rgba(217, 107, 147, 0.15);
        }

        .register-btn {
            background: #d96b93;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
        }

        .register-btn:hover {
            background: #c6537e;
            color: white;
        }

        .login-link {
            color: #c6537e;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .subtitle {
            color: #99717f;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="register-card">

    <!-- Logo and Heading -->
    <div class="text-center mb-4">

        <div class="logo">ABS</div>

        <h4 class="heading mt-3">
            ADVANCE BILLING SYSTEM
        </h4>

        <p class="subtitle">
            Admin Registration Portal
        </p>

        <hr style="border-color: #f3c5d5;">

        <h3 class="heading mt-3">
            Create Admin Account
        </h3>

        <p class="subtitle">
            Register to manage your billing system
        </p>

    </div>

    <!-- Registration Form -->
    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text"
                   name="full_name"
                   class="form-control"
                   placeholder="Enter your full name"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter your email address"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Choose username"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel"
                   name="phone"
                   class="form-control"
                   placeholder="Enter phone number"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Create password"
                   required>
        </div>

        <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password"
                   name="confirm_password"
                   class="form-control"
                   placeholder="Confirm password"
                   required>
        </div>

        <button type="submit" class="register-btn">
            Register Admin
        </button>

    </form>

    <!-- Login Link -->
    <div class="text-center mt-4">
        <p class="subtitle">
            Already have an account?
            <a href="#" class="login-link">Login</a>
        </p>
    </div>

</div>

</body>
</html>
