
<!DOCTYPE html>
<html>
<head>
    <title>QR Code Invoice Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f5;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #d63384;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #toast {
    visibility: hidden;
    min-width: 250px;
    padding: 15px;
    position: fixed;
    top: 20px;
    right: 20px;
    border-radius: 8px;
    color: white;
    text-align: center;
    z-index: 1000;
}

#toast.success {
    background: #28a745;
}

#toast.error {
    background: #dc3545;
}

#toast.show {
    visibility: visible;
}
        
    </style>
</head>

<body>
<div id="toast"></div>
<div class="container">

    <h2>QR Code Invoice Details</h2>

    <form id="qrForm">

        <input type="file" id="qrImage" accept="image/*" required>

        <button type="submit">Decode QR Code</button>

    </form>

    <div id="result"></div>

</div>

<script>
    function showToast(message, type) {
    const toast = document.getElementById('toast');

    toast.innerText = message;
    toast.className = 'show ' + type;

    setTimeout(function() {
        toast.className = '';
    }, 3000);
}
    document.getElementById('qrForm').addEventListener('submit', async function(e) {

        e.preventDefault();

        const file = document.getElementById('qrImage').files[0];
        const result = document.getElementById('result');

        const formData = new FormData();
        formData.append('qr_image', file);

        const response = await fetch('/decode-qr/', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

      result.style.display = 'block';

if (data.status === 'success') {
    result.innerText = data.qr_data;
    showToast('QR Code decoded successfully!', 'success');
} else {
    result.innerText = data.message;
    showToast(data.message, 'error');
}
    });
</script>

</body>
</html>
